name: Doxygen GitHub Pages Deploy Action

on:
  push:
    branches:
      - main
      - doxify

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz texlive-xetex \
            texlive-fonts-recommended texlive-latex-recommended \
            texlive-latex-extra

      - name: Generate Doxygen documentation
        run: doxygen docs/Doxyfile

      - name: Build the paper
        run: make -C papers transcode-view.html transcode-view.pdf

      - name: Add the paper to the published tree
        run: |
          mkdir -p docs/html/paper
          cp papers/generated/transcode-view.html papers/generated/transcode-view.pdf docs/html/paper/
          touch docs/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/html
