# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception

name: Makefile Workflow Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'
permissions:
  contents: read

jobs:
  test_matrix:
    strategy:
      fail-fast: false
    name: Test System Compiler with Makefile
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bemanproject/infra-containers-gcc:latest
    env:
      VCPKG: ""
      _cmake_args: "-DBUILD_TELEMETRY_CONFIGURATION=TRUE"
    steps:
      # - name: Harden the runner (Audit all outbound calls)
      #   uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      #   with:
      #     egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Install a specific version of uv.
          version: "0.11.6"

      - name: Install ccache and jq
        shell: bash
        run: |
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
            | tar xJ --strip-components=1 -C /usr/local/bin ccache-4.13.6-linux-x86_64-glibc/ccache
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 \
            -o /usr/local/bin/jq
          chmod +x /usr/local/bin/jq
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks

      - name: Configure Environment
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make venv
        env:
          CMAKE_GENERATOR: "Ninja Multi-Config"
      - name: Build
        shell: bash
        run: |
          source .venv/bin/activate
          make compile
      - name: Test
        shell: bash
        run: |
          source .venv/bin/activate
          make test
      - name: Generate Coverage Files
        shell: bash
        run: |
          source .venv/bin/activate
          make coverage
      # The per-pull-request half of the wording drift gate. It hashes the
      # headers the paper's wording is generated from and fails when they have
      # moved without a regeneration, which needs no specgen and takes no time.
      # A header named in papers/wording/PENDING is allowed to be ahead; the
      # wording_pending job below is what keeps such an entry from becoming
      # permanent.
      #
      # The other half -- regenerate everything and diff -- does need a
      # specgen, and has no workflow: one was written, run, and removed, for
      # the reasons in papers/wording/README.md. `make wording-check` is local.
      - name: Wording inputs
        shell: bash
        run: |
          source .venv/bin/activate
          make wording-inputs-check
      - name: Lint
        shell: bash
        run: |
          source .venv/bin/activate
          make lint
      - name: Manual Lint
        shell: bash
        run: |
          source .venv/bin/activate
          make lint
      - name: Test Install
        shell: bash
        run: |
          source .venv/bin/activate
          make testinstall

  # A pending entry is a deferred regeneration, which is fine in the middle of
  # a series of changes and not fine indefinitely. Deliberately not run on
  # pull_request or on push: a series lands on main one change at a time, so
  # failing there would defeat the exemption it is meant to police.
  #
  # The nightly is the right place. It blocks nobody's merge, and a red nightly
  # is the signal that an entry has outlived the work it was added for. Run it
  # by hand before tagging or publishing a paper revision -- `make
  # wording-pending-check` is the same check.
  wording_pending:
    name: No deferred wording regeneration
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for a deferred regeneration
        shell: bash
        run: make wording-pending-check
