# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    groups:
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/*"
          - "github/*"
      github-owned-actions:
        patterns:
          - "actions/*"
          - "github/*"
    schedule:
      interval: "daily"
  # The Python tools live in pyproject.toml's dependency-groups, which the uv
  # ecosystem already reads. A pip entry for the same directory parses the same
  # file and opens a duplicate pull request for every update.
  - package-ecosystem: "uv"
    directory: "/"
    # clang-format and clang-tidy are pinned to the same LLVM release, and
    # tools/tests/test_tool_versions.py requires it. Their PyPI wheels are not
    # published together: clang-format 23.1.5 existed while clang-tidy stopped
    # at 23.1.4, so any Dependabot bump (grouped or not) lands one without the
    # other, and never touches the pre-commit mirrors-clang-format rev. Bump
    # all three by hand, in one change, once both wheels exist.
    ignore:
      - dependency-name: "clang-format"
      - dependency-name: "clang-tidy"
    schedule:
      interval: "daily"
