# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    groups:
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/*"
          - "github/*"
      github-owned-actions:
        patterns:
          - "actions/*"
          - "github/*"
    schedule:
      interval: "daily"
  # The Python tools live in pyproject.toml's dependency-groups, which the uv
  # ecosystem already reads. A pip entry for the same directory parses the same
  # file and opens a duplicate pull request for every update.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
